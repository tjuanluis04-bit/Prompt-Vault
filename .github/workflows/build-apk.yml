name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias npm
        run: npm install

      - name: Añadir plataforma Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aplicar ícono personalizado
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            cp "resources/icons/mipmap-$d/"*.png "android/app/src/main/res/mipmap-$d/"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp resources/icons/mipmap-anydpi-v26/*.xml android/app/src/main/res/mipmap-anydpi-v26/

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: promptvault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir ícono para Play Store
        uses: actions/upload-artifact@v4
        with:
          name: playstore-icon
          path: resources/icons/playstore-icon-512.png
